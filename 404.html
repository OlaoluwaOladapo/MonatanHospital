<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Monatan Central Specialist Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      text-align: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }
    .not-found__bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 80% 20%, rgba(74,124,89,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 20% 80%, rgba(232,131,58,0.07) 0%, transparent 60%);
      pointer-events: none;
    }
    .not-found__inner {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }
    .not-found__code {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 18vw, 10rem);
      font-weight: 900;
      color: var(--green);
      line-height: 1;
      opacity: 0.15;
      display: block;
      margin-bottom: -20px;
    }
    .not-found__icon { font-size: 4rem; margin-bottom: 16px; display: block; }
    .not-found__title {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 900;
      color: var(--brown);
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .not-found__title em { font-style: normal; color: var(--green); }
    .not-found__sub {
      font-size: 1rem;
      color: var(--text-light);
      line-height: 1.75;
      margin-bottom: 36px;
    }
    .not-found__actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }
    .not-found__links {
      border-top: 1px solid var(--grey-light);
      padding-top: 28px;
    }
    .not-found__links p {
      font-family: var(--font-heading);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--grey);
      margin-bottom: 16px;
    }
    .not-found__nav {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .not-found__nav a {
      font-family: var(--font-heading);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--green);
      padding: 8px 16px;
      border-radius: 100px;
      background: rgba(74,124,89,0.08);
      transition: var(--transition);
    }
    .not-found__nav a:hover { background: var(--green); color: var(--white); }
  </style>
</head>
<body>

  <section class="not-found">

      <p class="not-found__sub">The page you're looking for doesn't exist or may have been moved. But don't worry, our team is still here for you.</p>
      <div class="not-found__actions">
        <a href="index.html" class="btn btn--primary btn--lg">← Back to Home</a>
        <a href="appointment.html" class="btn btn--outline btn--lg">Book Appointment</a>
      </div>
      <div class="not-found__links">
        <p>Or visit one of these pages</p>
        <nav class="not-found__nav">
          <a href="about.html">About Us</a>
          <a href="services.html">Services</a>
          <a href="contact.html">Contact</a>
          <a href="https://wa.me/2349074695516" target="_blank">WhatsApp</a>
        </nav>
      </div>
    </div>
  </section>
